name: agentos_kernel
description: Kernel modules for agent orchestration and memory.
version: 0.1.0
repository: https://github.com/agentos-org/agentos-kernel

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  cron: ^0.6.1
  drift: ^2.30.1
  http: ^1.2.2
  json_annotation: ^4.9.0
  sqlite3: ^2.9.4
  dart_openai_sdk: ^6.0.0
  lite_embeddings_sdk_dart:
    path: ../lite_embeddings_sdk_dart
  liteagent_sdk_dart:
    path: ../liteagent_sdk_dart
  opentool_dart: ^2.0.0
  opentool_daemon:
    path: ../opentool-hub/opentool-util-daemon

dev_dependencies:
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  lints: ^6.0.0
  test: ^1.25.6
